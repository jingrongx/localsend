name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    uses: ./.github/workflows/build_android_apk.yml
    secrets: inherit

  release:
    needs:
      - build_apk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # When triggered by a tag push, the tag must match the app version.
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v${{ steps.get_version.outputs.version }}" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match app version v${{ steps.get_version.outputs.version }}"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' app/assets/CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release v$VERSION" > release_notes.md
          fi

      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          name: apk-result
          path: apk-result

      - name: Rename APKs
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cp apk-result/app-armeabi-v7a-release.apk "LocalSendX-$VERSION-android-arm32v7.apk"
          cp apk-result/app-arm64-v8a-release.apk "LocalSendX-$VERSION-android-arm64v8.apk"
          cp apk-result/app-x86_64-release.apk "LocalSendX-$VERSION-android-x64.apk"
          ls -l LocalSendX-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: LocalSend X v${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          files: LocalSendX-*.apk
          fail_on_unmatched_files: true
