[workspace]
resolver = "3"
members = [
    "cli",
    "packages/core",
    "packages/localsend_isolates/rust",
    "server",
]

# `getifaddrs(3)` only exists in bionic since API 24, and the import survives
# linking, so the vendored copies enumerate interfaces via netlink on Android
# and the library can load on Android 5.x/6.x. See
# support/patches/*/README-PATCH.md.
[patch.crates-io]
if-addrs = { path = "support/patches/if-addrs" }
webrtc-util = { path = "support/patches/webrtc-util" }

# Profiles are only honored in the workspace root manifest.

# Full debuginfo dominates target/ size; line tables keep backtraces usable.
[profile.dev]
debug = "line-tables-only"

# RSA key generation is bignum-heavy and takes ~10x longer unoptimized;
# keep the crypto crates optimized in dev so tests stay fast.
[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2
